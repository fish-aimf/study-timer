<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Timer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #fff;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  #setup {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    width: 320px;
  }
  #setup h1 {
    font-size: 15px;
    font-weight: 400;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .field {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .field label {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .field input {
    background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 20px;
    font-weight: 500;
    color: #fff;
    outline: none;
    width: 100%;
    text-align: center;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: rgba(255,255,255,0.35); }
  .field input::placeholder { color: rgba(255,255,255,0.15); }
  #start-btn {
    background: rgba(255,255,255,0.08);
    border: 0.5px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 13px 48px;
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: background 0.15s, border-color 0.15s;
    width: 100%;
  }
  #start-btn:hover {
    background: rgba(255,255,255,0.13);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
  }
  #total-studied {
    font-size: 11px;
    color: rgba(255,255,255,0.18);
    letter-spacing: 0.06em;
    text-align: center;
  }
  #timer-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    position: relative;
    width: 100%;
    height: 100vh;
    justify-content: center;
  }
  #time-display {
    font-size: clamp(80px, 18vw, 160px);
    font-weight: 200;
    letter-spacing: -0.03em;
    line-height: 1;
    transition: color 0.4s;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  #time-display.danger { color: #ff4444; }
  #time-display.critical {
    color: #ff1111;
    animation: pulse 0.5s infinite alternate;
  }
  #time-display.negative {
    color: #ff0000;
    animation: pulse 0.3s infinite alternate;
  }
  @keyframes pulse {
    from { opacity: 1; }
    to { opacity: 0.4; }
  }
  #live-total {
    font-size: 13px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.06em;
    margin-top: 16px;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }
  #add-amount-control {
    position: fixed;
    bottom: 32px;
    right: 32px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #add-amount-control label {
    font-size: 11px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #add-amount {
    background: transparent;
    border: none;
    border-bottom: 0.5px solid rgba(255,255,255,0.2);
    padding: 2px 4px;
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    outline: none;
    width: 44px;
    text-align: center;
  }
  #add-amount:focus {
    color: rgba(255,255,255,0.8);
    border-bottom-color: rgba(255,255,255,0.5);
  }
  #add-amount-control span {
    font-size: 11px;
    color: rgba(255,255,255,0.2);
  }
  #flash {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.04);
    pointer-events: none;
    opacity: 0;
  }
  #game-over {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    text-align: center;
  }
  #game-over h2 {
    font-size: 48px;
    font-weight: 200;
    color: #ff4444;
    letter-spacing: -0.02em;
  }
  #game-over p {
    font-size: 13px;
    color: rgba(255,255,255,0.3);
  }
  #total-msg {
    font-size: 11px;
    color: rgba(255,255,255,0.2);
  }
  #restart-btn {
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 10px 32px;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 4px;
  }
  #restart-btn:hover {
    border-color: rgba(255,255,255,0.35);
    color: rgba(255,255,255,0.9);
  }
  #hint {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.5s;
    white-space: nowrap;
  }
  #progress-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 2px;
    background: rgba(255,255,255,0.2);
    transition: width 0.9s linear, background-color 0.4s;
    width: 100%;
  }
  #progress-bar.danger { background: rgba(255,68,68,0.6); }
</style>
</head>
<body>

<div id="setup">
  <h1>Study Timer</h1>
  <div class="field">
    <label>Starting seconds</label>
    <input type="number" id="start-time" placeholder="60" min="5" value="">
  </div>
  <div class="field">
    <label>Seconds per space</label>
    <input type="number" id="add-time" placeholder="15" min="1" value="">
  </div>
  <button id="start-btn">Start</button>
  <div id="total-studied"></div>
</div>

<div id="timer-screen">
  <div id="time-display">00:00</div>
  <div id="live-total"></div>
  <div id="add-amount-control">
    <label>+sec</label>
    <input type="number" id="add-amount" min="1" max="999">
    <span>/ space</span>
  </div>
  <div id="hint">space to add time</div>
  <div id="progress-bar"></div>
</div>

<div id="game-over">
  <h2>Time's up.</h2>
  <p id="score-msg"></p>
  <div id="total-msg"></div>
  <button id="restart-btn">Try again</button>
</div>

<div id="flash"></div>

<script>
  let timeLeft = 0;
  let maxTime = 0;
  let addPerSpace = 15;
  let interval = null;
  let spaceCount = 0;
  let running = false;
  let sessionStart = null;
  let db = null;
  let baseTotalSeconds = 0; // total from DB before this session
  let currentSessionSeconds = 0; // seconds elapsed this session

  const setupEl = document.getElementById('setup');
  const timerScreen = document.getElementById('timer-screen');
  const gameOverEl = document.getElementById('game-over');
  const display = document.getElementById('time-display');
  const liveTotalEl = document.getElementById('live-total');
  const progressBar = document.getElementById('progress-bar');
  const addAmountInput = document.getElementById('add-amount');
  const hintEl = document.getElementById('hint');
  const flashEl = document.getElementById('flash');

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('StudyTimerDB', 3);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        const tx = e.target.transaction;
        // Migrate from old sessions store if it exists
        let migratedSeconds = 0;
        if (d.objectStoreNames.contains('sessions')) {
          const sessionStore = tx.objectStore('sessions');
          sessionStore.getAll().onsuccess = ev => {
            migratedSeconds = (ev.target.result || []).reduce((a, s) => a + (s.seconds || 0), 0);
            if (!d.objectStoreNames.contains('meta')) {
              d.createObjectStore('meta', { keyPath: 'key' });
            }
            if (migratedSeconds > 0) {
              tx.objectStore('meta').put({ key: 'totalSeconds', value: migratedSeconds });
            }
          };
        }
        if (!d.objectStoreNames.contains('meta')) {
          d.createObjectStore('meta', { keyPath: 'key' });
        }
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e);
    });
  }

  function dbGet(key) {
    return new Promise((resolve) => {
      if (!db) return resolve(null);
      const tx = db.transaction('meta', 'readonly');
      const req = tx.objectStore('meta').get(key);
      req.onsuccess = e => resolve(e.target.result ? e.target.result.value : null);
      req.onerror = () => resolve(null);
    });
  }

  function dbSet(key, value) {
    if (!db) return;
    const tx = db.transaction('meta', 'readwrite');
    tx.objectStore('meta').put({ key, value });
  }

  function getTotalStudied() {
    return dbGet('totalSeconds').then(v => v || 0);
  }

  function fmtDuration(s) {
    s = Math.floor(s);
    if (s < 60) return s + 's';
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return h + 'h ' + m + 'm';
    return m + 'm ' + sec + 's';
  }

  async function showTotalOnSetup() {
    const total = await getTotalStudied();
    const el = document.getElementById('total-studied');
    el.textContent = total > 0 ? fmtDuration(total) + ' studied total' : '';
  }

  openDB().then(d => { db = d; showTotalOnSetup(); }).catch(() => {});

  function updateLiveTotal() {
    const total = baseTotalSeconds + currentSessionSeconds;
    liveTotalEl.textContent = fmtDuration(total) + ' total';
  }

  function fmt(s) {
    const neg = s < 0;
    const abs = Math.abs(s);
    const m = Math.floor(abs / 60);
    const sec = Math.floor(abs % 60);
    return (neg ? '-' : '') + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  function updateDisplay() {
    display.textContent = fmt(timeLeft);
    const ratio = Math.max(0, timeLeft / maxTime);
    progressBar.style.width = (ratio * 100) + '%';

    if (timeLeft < 0) {
      display.className = 'negative';
      progressBar.className = 'danger';
    } else if (timeLeft <= 10) {
      display.className = 'critical';
      progressBar.className = 'danger';
    } else if (timeLeft <= 20) {
      display.className = 'danger';
      progressBar.className = 'danger';
    } else {
      display.className = '';
      progressBar.className = '';
    }
  }

  function tick() {
    timeLeft -= 1;
    currentSessionSeconds += 1;
    updateDisplay();
    updateLiveTotal();
  }

  function endGame() {
    clearInterval(interval);
    running = false;
    timerScreen.style.display = 'none';
    gameOverEl.style.display = 'flex';
    document.getElementById('score-msg').textContent =
      spaceCount === 1 ? '1 question solved' : spaceCount + ' questions solved';
    const total = baseTotalSeconds + currentSessionSeconds;
    document.getElementById('total-msg').textContent =
      total > 0 ? fmtDuration(total) + ' studied total' : '';
  }

  function flashScreen() {
    flashEl.style.opacity = '1';
    setTimeout(() => { flashEl.style.opacity = '0'; }, 120);
  }

  document.getElementById('start-btn').addEventListener('click', () => {
    const st = parseInt(document.getElementById('start-time').value) || 60;
    const at = parseInt(document.getElementById('add-time').value) || 15;
    startTimer(st, at);
  });

  ['start-time','add-time'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('start-btn').click();
    });
  });

  async function startTimer(st, at) {
    baseTotalSeconds = await getTotalStudied();
    currentSessionSeconds = 0;
    timeLeft = st;
    maxTime = st;
    addPerSpace = at;
    spaceCount = 0;
    sessionStart = Date.now();
    addAmountInput.value = at;
    setupEl.style.display = 'none';
    gameOverEl.style.display = 'none';
    timerScreen.style.display = 'flex';
    hintEl.style.opacity = '1';
    running = true;
    updateDisplay();
    updateLiveTotal();
    interval = setInterval(tick, 1000);
    setTimeout(() => { hintEl.style.opacity = '0'; }, 3000);
  }

  document.getElementById('restart-btn').addEventListener('click', () => {
    gameOverEl.style.display = 'none';
    setupEl.style.display = 'flex';
    showTotalOnSetup();
  });

  addAmountInput.addEventListener('input', () => {
    const v = parseInt(addAmountInput.value);
    if (v > 0) addPerSpace = v;
  });

  window.addEventListener('beforeunload', e => {
    if (running && currentSessionSeconds > 0) {
      dbSet('totalSeconds', baseTotalSeconds + currentSessionSeconds);
      e.preventDefault();
      e.returnValue = '';
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === ' ' && running) {
      e.preventDefault();
      timeLeft += addPerSpace;
      if (timeLeft > maxTime) maxTime = timeLeft;
      spaceCount++;
      updateDisplay();
      flashScreen();
    }
  });
</script>
</body>
</html>
